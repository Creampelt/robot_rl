[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_rl"
version = "5.4.1"
keywords = ["reinforcement-learning", "robotics"]
maintainers = [
  { name="Clemens Schwarke", email="cschwarke@ethz.ch" },
  { name="Mayank Mittal", email="mittalma@ethz.ch" },
]
authors = [
  { name="Clemens Schwarke", email="cschwarke@ethz.ch" },
  { name="Mayank Mittal", email="mittalma@ethz.ch" },
  { name="Nikita Rudin", email="rudinn@ethz.ch" },
  { name="David Hoeller", email="holler.david78@gmail.com" },
]
description = "Fast and simple RL algorithms implemented in PyTorch"
readme = { file = "README.md", content-type = "text/markdown" }
license = "BSD-3-Clause"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # Pinned to the Isaac Sim container's exact bundled stack (torch 2.7.0+cu128 / NCCL 2.26.2 cu12,
    # which the cluster's CUDA-13.1 driver + Blackwell GPUs support). An unpinned or floor spec lets
    # the Ray cluster's per-node install resolve torch INCONSISTENTLY (hcrl1 2.26.2 vs hcrl2 2.27.3 ->
    # multi-GPU NCCL version-mismatch crash) or pull a CUDA-13.2 wheel (>=2.9, driver-incompatible).
    # The exact pin is satisfied by the container's preinstalled 2.7.0+cu128 (no reinstall) and keeps
    # every node identical. Keep in sync with hcrl_isaaclab/pyproject.toml.
    "torch==2.7.0",
    "torchvision==0.22.0",
    "tensordict>=0.7.0",
    "packaging<24",
    "numpy>=1.16.4",
    "GitPython",
    "onnx",
    "POT==0.9.6",
    "onnxscript>=0.5.4",
]

[project.urls]
Homepage = "https://github.com/Creampelt/robot_rl"
Issues = "https://github.com/Creampelt/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["robot_rl*"]

[tool.setuptools]
license-files = [
    "LICENSE*",
    "licenses/dependencies/*.txt",
]

[tool.pyright]
include = ["robot_rl"]
typeCheckingMode = "basic"
pythonVersion = "3.9"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true
# This is required as the CI pre-commit does not download the module (i.e. numpy, torch, prettytable)
reportMissingImports = "none"
# This is required to ignore type checks of modules with stubs missing.
reportMissingModuleSource = "none"  # -> most common: prettytable in mdp managers
reportGeneralTypeIssues = "none"  # -> usage of literal MISSING in dataclasses
reportOptionalMemberAccess = "none"
reportPrivateUsage = "warning"

[tool.codespell]
ignore-words-list = "ot"
